# ===============================
# Server
# ===============================
server.port=8081

# ===============================
# H2 Database (In-Memory)
# ===============================
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# ===============================
# MySQL datasource (XAMPP) - DISABLED
# ===============================
# spring.datasource.url=jdbc:mysql://localhost:3306/cpu_grid_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=${DB_USERNAME:root}
# spring.datasource.password=${DB_PASSWORD:}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ===============================
# JWT
# ===============================
security.jwt.secret=${JWT_SECRET_BASE64:3GH+M+YScz6gnTGuZ5hmVco9zHdwfghXMpPz7jVI8wAwfATRayRomMqRKAtkI9Es1dvgVXQryfNiJbYAtt/6tA==}
security.jwt.expirationMillis=${JWT_EXPIRATION_MS:86400000}

# ===============================
# CORS (Frontend)
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

# ===============================
# Mail (optional)
# ===============================
app.mail.send.enabled=${MAIL_SEND_ENABLED:false}
app.mail.expose.code=${MAIL_EXPOSE_CODE:true}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Bootstrap admin
# ===============================
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=INFO
logging.level.com.trafficjam1.authservice=DEBUG
