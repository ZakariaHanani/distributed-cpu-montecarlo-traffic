# ===============================
# Server
# ===============================
server.port=8081

# ===============================
# MySQL datasource
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/cpu_grid_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=cpu_grid
spring.datasource.password=StrongPassword123!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

