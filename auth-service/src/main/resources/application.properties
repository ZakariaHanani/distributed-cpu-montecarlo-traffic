# ===============================
# Server
# ===============================
server.port=8081


# ===============================
# MySQL datasource
# Tip: in real projects, move credentials to env vars
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/cpu_grid_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:cpu_grid}
spring.datasource.password=${DB_PASSWORD:StrongPassword123!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update

# Disable Open Session In View (cleaner architecture; avoids lazy-loading during rendering)
spring.jpa.open-in-view=false

# Logs: keep SQL visible while developing; turn off in production
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANT:
# Do NOT set MySQL8Dialect (deprecated). Let Hibernate auto-detect,
# or use MySQLDialect if you really want to force it.
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# ===============================
# JWT
# IMPORTANT: must be Base64
# Tip: store secret in env var, not in git
# ===============================
security.jwt.secret=${JWT_SECRET_BASE64:3GH+M+YScz6gnTGuZ5hmVco9zHdwfghXMpPz7jVI8wAwfATRayRomMqRKAtkI9Es1dvgVXQryfNiJbYAtt/6tA==}
security.jwt.expirationMillis=${JWT_EXPIRATION_MS:86400000}


# ===============================
# CORS (Frontend)
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}


# ===============================
# Mail (optional for now)
# ===============================
app.mail.send.enabled=${MAIL_SEND_ENABLED:false}
app.mail.expose.code=${MAIL_EXPOSE_CODE:true}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ===============================
# Bootstrap admin (creates first ADMIN at startup if missing)
# ===============================
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}


# ===============================
# Logging (optional nice defaults)
# ===============================
logging.level.org.springframework.security=INFO
logging.level.com.trafficjam1.authservice=DEBUG
