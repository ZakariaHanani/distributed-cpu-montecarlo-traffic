# ===============================
# JPA / Hibernate (H2 Dialect - Commented out)
# ===============================
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===============================
# Flyway (Disabled for H2 quickstart)
# ===============================
spring.flyway.enabled=false

# ===============================
# JWT
# ===============================
security.jwt.secret=${JWT_SECRET_BASE64:3GH+M+YScz6gnTGuZ5hmVco9zHdwfghXMpPz7jVI8wAwfATRayRomMqRKAtkI9Es1dvgVXQryfNiJbYAtt/6tA==}
security.jwt.expirationMillis=${JWT_EXPIRATION_MS:86400000}

# ===============================
# CORS (Frontend)
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

# ===============================
# Mail (optional)
# ===============================
app.mail.send.enabled=${MAIL_SEND_ENABLED:false}
app.mail.expose.code=${MAIL_EXPOSE_CODE:true}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Bootstrap admin
# ===============================
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=INFO
logging.level.com.trafficjam1.authservice=DEBUG
logging.level.org.hibernate.dialect.Dialect=ERROR
logging.level.org.hibernate.orm.deprecation=ERROR
logging.level.com.trafficjam1.authservice.user.AdminBootstrap=ERROR
